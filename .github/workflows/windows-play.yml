# Fork-only test build (never PR this): the release-profile Windows installer of
# test/windows-play, after clippy and the workspace tests on windows-latest.
name: Windows play build

on:
  push:
    branches: [test/windows-play]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps -> target
      - run: npm ci
        env:
          SPGUI_SKIP_PREPARE: "1"
      - run: npm run build
      - run: npm ci
        working-directory: apps/desktop
      - run: apps/desktop/scripts/assemble-frontend.sh
      - name: cargo clippy
        working-directory: apps
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        working-directory: apps
        run: cargo test --workspace --locked
      - name: tauri build (release, NSIS)
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis --ci
      - uses: actions/upload-artifact@v4
        with:
          name: sessionpipe-windows-play-nsis
          path: apps/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
